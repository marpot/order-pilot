apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderpilot-frontend
  namespace: orderpilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orderpilot-frontend
  template:
    metadata:
      labels:
        app: orderpilot-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/orderpilot-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5173
          envFrom:
            - configMapRef:
                name: orderpilot-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orderpilot-frontend
  namespace: orderpilot
spec:
  selector:
    app: orderpilot-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
