apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderpilot-backend
  namespace: orderpilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orderpilot-backend
  template:
    metadata:
      labels:
        app: orderpilot-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/orderpilot-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: orderpilot-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: orderpilot-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderpilot-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: orderpilot-secrets
                  key: postgres-db
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@orderpilot-postgres:5432/$(POSTGRES_DB)
            - name: LANGFLOW_FLOW_ID
              valueFrom:
                secretKeyRef:
                  name: orderpilot-secrets
                  key: langflow-flow-id
                  optional: true
            - name: LANGFLOW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orderpilot-secrets
                  key: langflow-api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orderpilot-backend
  namespace: orderpilot
spec:
  selector:
    app: orderpilot-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
