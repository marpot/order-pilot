apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderpilot-langflow
  namespace: orderpilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderpilot-langflow
  template:
    metadata:
      labels:
        app: orderpilot-langflow
    spec:
      containers:
        - name: langflow
          image: langflowai/langflow:1.11.0
          ports:
            - name: http
              containerPort: 7860
          env:
            - name: LANGFLOW_AUTO_LOGIN
              value: "false"
            - name: LANGFLOW_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderpilot-secrets
                  key: langflow-superuser-password
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: orderpilot-langflow
  namespace: orderpilot
spec:
  selector:
    app: orderpilot-langflow
  ports:
    - name: http
      port: 7860
      targetPort: http
