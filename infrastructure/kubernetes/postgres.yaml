apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orderpilot-postgres-data
  namespace: orderpilot
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orderpilot-postgres
  namespace: orderpilot
spec:
  serviceName: orderpilot-postgres
  replicas: 1
  selector:
    matchLabels:
      app: orderpilot-postgres
  template:
    metadata:
      labels:
        app: orderpilot-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: orderpilot-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderpilot-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: orderpilot-secrets
                  key: postgres-db
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: orderpilot-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: orderpilot-postgres
  namespace: orderpilot
spec:
  clusterIP: None
  selector:
    app: orderpilot-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
