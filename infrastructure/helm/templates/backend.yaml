apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orderpilot.fullname" . }}-backend
  labels:
    {{- include "orderpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicas.backend }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "orderpilot.fullname" . }}
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: postgres-user } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: postgres-password } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: postgres-db } }
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "orderpilot.fullname" . }}-postgres:5432/$(POSTGRES_DB)
            {{- if .Values.langflow.enabled }}
            - name: LANGFLOW_FLOW_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: {{ .Values.langflow.flowIdSecretKey }} } }
            - name: LANGFLOW_API_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: {{ .Values.langflow.apiKeySecretKey }} } }
            {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orderpilot.fullname" . }}-backend
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.service.backend.port }}
      targetPort: http
