{{- if .Values.langflow.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orderpilot.fullname" . }}-langflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: langflow
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: langflow
    spec:
      containers:
        - name: langflow
          image: "{{ .Values.images.langflow.repository }}:{{ .Values.images.langflow.tag }}"
          ports:
            - name: http
              containerPort: 7860
          env:
            - name: LANGFLOW_AUTO_LOGIN
              value: "false"
            - name: LANGFLOW_SUPERUSER_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: langflow-superuser-password } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
          resources:
            {{- toYaml .Values.resources.langflow | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orderpilot.fullname" . }}-langflow
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: langflow
  ports:
    - name: http
      port: 7860
      targetPort: http
{{- end }}
